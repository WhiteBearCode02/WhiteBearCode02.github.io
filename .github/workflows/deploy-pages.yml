name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify committed Next.js project
        run: node scripts/verify-project.mjs
      - name: Verify GitHub Actions publishing source
        run: node scripts/verify-pages-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build static portfolio
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check TypeScript
        run: npm run typecheck
      - name: Verify required exported pages
        run: node scripts/verify-static-export.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
